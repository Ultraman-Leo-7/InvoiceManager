name: CI

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "invoice_extract.py"
      - "jd_qq.py"
      - "purchase_tracker.py"
      - "data_backup.py"
      - "self_update.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "tools/**"
      - "assets/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile app.py invoice_extract.py jd_qq.py purchase_tracker.py data_backup.py self_update.py tools/generate_icon.py
          python -c "import app, invoice_extract, jd_qq, purchase_tracker, data_backup, self_update; print('import check ok')"

      - name: Unit tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Generate app icon
        shell: pwsh
        run: |
          python tools/generate_icon.py

      - name: PyInstaller packaging smoke test
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon "assets/InvoiceManager.ico" `
            --name "InvoiceManager-Windows-x64" `
            app.py
          if (-not (Test-Path "dist/InvoiceManager-Windows-x64.exe")) {
            throw "exe build output not found"
          }

      - name: Upload CI executable
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-Windows-x64-CI
          path: dist/InvoiceManager-Windows-x64.exe
          if-no-files-found: error
