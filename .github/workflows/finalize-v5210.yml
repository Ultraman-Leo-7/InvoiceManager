name: Finalize v5.2.10 docs

on:
  push:
    paths:
      - ".github/workflows/finalize-v5210.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize docs
        run: python tools/finalize_v5210.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git commit -m "Finalize v5.2.10 documentation"
          git push
