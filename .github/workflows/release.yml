name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v5.2.12"
        required: true
        default: "v5.2.12"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/release-v5.2.12.trigger"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile app.py version.py invoice_extract.py jd_qq.py purchase_tracker.py data_backup.py self_update.py tools/generate_icon.py
          python -c "import app, version, invoice_extract, jd_qq, purchase_tracker, data_backup, self_update; print('import check ok')"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Generate app icon
        shell: pwsh
        run: |
          python tools/generate_icon.py
          if (-not (Test-Path "assets/InvoiceManager.ico")) {
            throw "icon generation failed"
          }

      - name: Build single-file Windows exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon "assets/InvoiceManager.ico" `
            --name "InvoiceManager-Windows-x64" `
            app.py
          if (-not (Test-Path "dist/InvoiceManager-Windows-x64.exe")) {
            throw "exe build output not found"
          }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/InvoiceManager-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  InvoiceManager-Windows-x64.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-Windows-x64
          path: |
            dist/InvoiceManager-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || 'v5.2.12' }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid version format: $env:RELEASE_VERSION"
          }

          gh release create $env:RELEASE_VERSION `
            "dist/InvoiceManager-Windows-x64.exe" `
            "dist/SHA256SUMS.txt" `
            --target "$env:GITHUB_SHA" `
            --title "InvoiceManager $env:RELEASE_VERSION" `
            --notes "InvoiceManager Windows x64 版本。v5.2.12 修复程序内更新后偶发的 PyInstaller onefile _MEI 临时目录 / python312.dll 启动错误。下载 InvoiceManager-Windows-x64.exe，放入发票 PDF 文件夹后直接双击运行。Release 同时提供 SHA256SUMS.txt 用于校验下载文件。"
