name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v5.2.9-beta.1 or v5.2.9"
        required: true
        default: "v5.2.9-beta.1"
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile app.py invoice_extract.py jd_qq.py purchase_tracker.py tools/generate_icon.py
          python -c "import app, invoice_extract, jd_qq, purchase_tracker; print('import check ok')"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Generate app icon
        shell: pwsh
        run: |
          python tools/generate_icon.py
          if (-not (Test-Path "assets/InvoiceManager.ico")) {
            throw "icon generation failed"
          }

      - name: Build single-file Windows exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon "assets/InvoiceManager.ico" `
            --name "InvoiceManager-Windows-x64" `
            app.py
          if (-not (Test-Path "dist/InvoiceManager-Windows-x64.exe")) {
            throw "exe build output not found"
          }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/InvoiceManager-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  InvoiceManager-Windows-x64.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-Windows-x64
          path: |
            dist/InvoiceManager-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid version format: $env:RELEASE_VERSION"
          }

          $args = @(
            "release", "create", $env:RELEASE_VERSION,
            "dist/InvoiceManager-Windows-x64.exe",
            "dist/SHA256SUMS.txt",
            "--target", $env:GITHUB_SHA,
            "--title", "InvoiceManager $env:RELEASE_VERSION",
            "--notes", "InvoiceManager Windows x64 版本。该版本在发布前已自动执行语法检查、import 检查和单元测试。下载 InvoiceManager-Windows-x64.exe，放入发票 PDF 文件夹后直接双击运行。Release 同时提供 SHA256SUMS.txt 用于校验下载文件。"
          )

          if ($env:RELEASE_PRERELEASE -eq "true") {
            $args += "--prerelease"
          }

          gh @args
