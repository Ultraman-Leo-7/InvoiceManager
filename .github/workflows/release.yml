name: Build Windows Release

on:
  push:
    branches: [main]
    paths:
      - "version.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release tag; must match version.py (leave blank to use it)"
        required: false
        default: ""
        type: string

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate version and prepare release notes
        id: release
        shell: python
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          import os
          import re
          import runpy
          from pathlib import Path

          tag = "v" + runpy.run_path("version.py")["APP_VERSION"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid application version: {tag}")
          requested = os.environ.get("REQUESTED_VERSION", "").strip()
          if requested and requested != tag:
              raise SystemExit(f"Requested {requested}, but version.py contains {tag}")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## {tag}\n"
          if heading not in changelog:
              raise SystemExit(f"CHANGELOG.md is missing {tag}")
          notes = changelog.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md has no release notes for {tag}")
          Path("release-notes.md").write_text(
              "InvoiceManager Windows x64 版本。下载 InvoiceManager-Windows-x64.exe 后直接运行；"
              "已有用户可在“设置 → 更新与反馈 → 检查更新”中升级。"
              "SHA256SUMS.txt 用于校验下载文件。\n\n" + notes + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile app.py version.py invoice_extract.py invoice_filing.py jd_qq.py purchase_tracker.py data_backup.py duplicate_files.py self_update.py tools/generate_icon.py
          python -c "import app, version, invoice_extract, invoice_filing, jd_qq, purchase_tracker, data_backup, duplicate_files, self_update; print('import check ok')"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Generate app icon
        shell: pwsh
        run: |
          python tools/generate_icon.py
          if (-not (Test-Path "assets/InvoiceManager.ico")) {
            throw "icon generation failed"
          }

      - name: Build single-file Windows exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon "assets/InvoiceManager.ico" `
            --name "InvoiceManager-Windows-x64" `
            app.py
          if (-not (Test-Path "dist/InvoiceManager-Windows-x64.exe")) {
            throw "exe build output not found"
          }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/InvoiceManager-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  InvoiceManager-Windows-x64.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: InvoiceManager-Windows-x64
          path: |
            dist/InvoiceManager-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid version format: $env:RELEASE_VERSION"
          }

          gh release create $env:RELEASE_VERSION `
            "dist/InvoiceManager-Windows-x64.exe" `
            "dist/SHA256SUMS.txt" `
            --target "$env:GITHUB_SHA" `
            --title "InvoiceManager $env:RELEASE_VERSION" `
            --notes-file "release-notes.md"
