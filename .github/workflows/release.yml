name: Build Windows Release

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "invoice_extract.py"
      - "jd_qq.py"
      - "purchase_tracker.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "tools/generate_icon.py"
      - "assets/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile app.py invoice_extract.py jd_qq.py purchase_tracker.py tools/generate_icon.py
          python -c "import app, invoice_extract, jd_qq, purchase_tracker; print('import check ok')"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Generate app icon
        shell: pwsh
        run: |
          python tools/generate_icon.py
          if (-not (Test-Path "assets/InvoiceManager.ico")) {
            throw "icon generation failed"
          }

      - name: Build single-file Windows exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon "assets/InvoiceManager.ico" `
            --name "InvoiceManager-Windows-x64" `
            app.py
          if (-not (Test-Path "dist/InvoiceManager-Windows-x64.exe")) {
            throw "exe build output not found"
          }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/InvoiceManager-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  InvoiceManager-Windows-x64.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-Windows-x64
          path: |
            dist/InvoiceManager-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v5.2.$env:GITHUB_RUN_NUMBER"
          gh release create $tag `
            "dist/InvoiceManager-Windows-x64.exe" `
            "dist/SHA256SUMS.txt" `
            --target "$env:GITHUB_SHA" `
            --title "InvoiceManager $tag" `
            --prerelease `
            --notes "InvoiceManager Windows x64 测试版。该版本在发布前已自动执行语法检查、import 检查和单元测试。下载 InvoiceManager-Windows-x64.exe，放入发票 PDF 文件夹后直接双击运行。Release 同时提供 SHA256SUMS.txt 用于校验下载文件。包含：PDF 发票解析、QQ 邮箱京东发票获取、购买记录、商品/快递费分开发票匹配、2 秒文件夹自动刷新、全字段搜索、表头排序、Ctrl/Shift 多选、人工确认/备注、批量删除发票、Excel 导出。"
