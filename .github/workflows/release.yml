name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v5.2.11"
        required: true
        default: "v5.2.11"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/release-v5.2.11.trigger"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile app.py invoice_extract.py jd_qq.py purchase_tracker.py data_backup.py self_update.py tools/generate_icon.py
          python -c "import app, invoice_extract, jd_qq, purchase_tracker, data_backup, self_update; print('import check ok')"

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m pytest -q

      - name: Generate app icon
        shell: pwsh
        run: |
          python tools/generate_icon.py
          if (-not (Test-Path "assets/InvoiceManager.ico")) {
            throw "icon generation failed"
          }

      - name: Build single-file Windows exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --icon "assets/InvoiceManager.ico" `
            --name "InvoiceManager-Windows-x64" `
            app.py
          if (-not (Test-Path "dist/InvoiceManager-Windows-x64.exe")) {
            throw "exe build output not found"
          }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/InvoiceManager-Windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  InvoiceManager-Windows-x64.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceManager-Windows-x64
          path: |
            dist/InvoiceManager-Windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v5.2.11"
          }
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid version format: $version"
          }

          gh release create $version `
            "dist/InvoiceManager-Windows-x64.exe" `
            "dist/SHA256SUMS.txt" `
            --target "$env:GITHUB_SHA" `
            --title "InvoiceManager $version" `
            --notes "InvoiceManager Windows x64 版本。v5.2.11 重构设置界面：左侧分类为‘通用、邮箱与发票、备份与恢复、更新与关于’；坚果云配置与恢复统一进入设置；主界面‘更多’仅保留设置、刷新发票文件夹和导出 Excel；更新页新增可点击 GitHub 项目地址与 Star 入口。下载 InvoiceManager-Windows-x64.exe，放入发票 PDF 文件夹后直接双击运行。Release 同时提供 SHA256SUMS.txt 用于校验下载文件。"
